<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
@page { size: 440px 920px; margin:0; }
* {box-sizing:border-box} html,body{margin:0;width:440px;height:920px;font-family:Inter,Arial,Helvetica,sans-serif;color:#21212a;background:#f9e3e6;}
.canvas{width:440px;height:920px;padding:10px 12px;background:radial-gradient(circle at 0 0,#ffe0e7,#fff7f6 34%,#e9faf6 100%);}
.phone{width:416px;height:900px;border-radius:40px;background:#fffdfc;border:3px solid #fff;overflow:hidden;box-shadow:0 10px 40px #6a2a3730;position:relative;}
.status{height:40px;padding:15px 25px 3px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
.top{height:63px;padding:9px 20px;display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid #f5edef;}
.back{font-size:22px;color:#a13e59}.appname{font-size:22px;color:#fa4777;font-weight:900;letter-spacing:-1px}.title{font-size:20px;font-weight:800;letter-spacing:-.4px}.more{font-size:20px;color:#556268}
.main{height:690px;overflow:hidden;padding:17px 19px 22px;position:relative;}
.main:after{content:'';position:absolute;height:14px;bottom:0;left:0;right:0;background:linear-gradient(transparent,#fffdfc);pointer-events:none}
.main h2{font-size:26px;line-height:1.12;margin:6px 0 12px;font-weight:850;letter-spacing:-1px}
.main p{font-size:14px;line-height:1.48;margin:8px 0 14px}.main .plain{font-size:16px;color:#272532}.muted{color:#737980}.label{font-size:13px;font-weight:800;margin:18px 0 8px}.subhead{font-size:13px;font-weight:700;text-align:center;color:#7c7880;margin:21px 0 10px}
.btn{border-radius:28px;min-height:50px;padding:14px 15px;background:linear-gradient(110deg,#ff4e7a,#f93571);color:white;text-align:center;font-size:15px;font-weight:800;box-shadow:0 6px 16px #ff376b30;margin:12px 0 4px}.outline{background:#fff;color:#d74a6c;border:1.5px solid #f5b9c8;box-shadow:none}
.teal-theme .btn:not(.outline){background:linear-gradient(120deg,#2ebda3,#038f78);box-shadow:0 6px 16px #00a98b32}
.panel{background:#fff;border:1px solid #f0e5e9;border-radius:21px;padding:14px 16px;margin:11px 0;box-shadow:0 5px 16px #432d390d}.pinkbox{background:linear-gradient(120deg,#ffecf0,#fff5f3);border-color:#ffe1e9}.tealbox{background:linear-gradient(120deg,#e0f9f3,#f2fffb);border-color:#c4f2e8}.paneltitle{font-size:16px;font-weight:850;margin-bottom:5px}.panel p{margin:5px 0 0;font-size:13px}
.field{background:#fff;border:1.4px solid #ecdedf;border-radius:17px;padding:11px 14px;margin:11px 0;min-height:56px}.field span{display:block;font-size:11px;color:#8b8792;font-weight:750;margin-bottom:4px}.field strong{display:block;font-size:14px;color:#2e2730;font-weight:650}.cols{display:flex;gap:6px}.cols>.field{width:50%}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 14px}.chip{display:inline-block;border:1px solid #d5e9e6;padding:9px 12px;border-radius:24px;font-size:12px;font-weight:700;color:#356c67;background:#fff}.chip.sel{background:#dbf8ee;border-color:#6fceae;color:#0a826c}
.notice{font-size:12px;line-height:1.45;color:#9b4d5d;background:#fff0f3;border-left:4px solid #ff6b8e;padding:12px 13px;border-radius:12px;margin:15px 0}
.item{display:flex;justify-content:space-between;align-items:center;padding:15px 10px;min-height:63px;border-bottom:1px solid #f1e9ec;gap:10px}.item strong{font-size:15px;display:block}.item small{display:block;font-size:12px;color:#84818a;margin-top:5px;line-height:1.25}.item b{font-size:13px;color:#ec4870;white-space:nowrap}.item b.good{color:#089c7f}
.photobox{background-position:center;background-size:cover;border-radius:20px;box-shadow:0 5px 18px #3332;margin-bottom:13px;background-color:#ffe4e8}
.miniperson{min-width:0;background:#fff;border:1px solid #f0e8eb;border-radius:19px;overflow:hidden;box-shadow:0 4px 12px #16101012;padding-bottom:8px}.miniperson>.photobox{border-radius:16px 16px 7px 7px;margin:0 0 8px;background-position:center 30%;}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}.personline{display:flex;justify-content:space-between;padding:0 8px;align-items:center}.personline strong{font-size:14px}.personline span{font-size:11px;color:#068d76}.miniperson>small{font-size:11px;color:#84818a;padding:0 8px;display:block;margin-top:4px}
.feedback{text-align:center;margin:53px auto 37px;max-width:332px}.feedback .giant{font-size:82px;color:#ff426e;line-height:1.1;margin-bottom:22px;font-weight:750}.feedback .giant.teal{color:#0ea98e}.feedback p{font-size:15px;color:#77707b;line-height:1.55}
.badge{display:inline-block;padding:7px 11px;background:#dff8ed;color:#087d6a;border-radius:20px;font-size:12px;font-weight:750;margin:4px 4px 8px 0}.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.photogrid div{height:135px;border-radius:18px;border:2px dashed #b5dbd3;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;font-size:13px;color:#058c75;font-weight:800;background-color:#effffb}
.otp{display:flex;gap:8px;margin:35px 0}.otp span{background:#fff;border:1px solid #f8aec0;border-radius:12px;padding:16px 17px;font-size:22px;color:#f04874;font-weight:700}
.overlay-name{font-size:27px;font-weight:900;color:#f7527a;margin:0 0 10px}.actionrow{display:flex;justify-content:center;gap:35px;text-align:center;font-size:38px;color:#f75179;margin-top:20px}.actionrow>div{border-radius:50%;background:#fff;box-shadow:0 4px 15px #aaa5;width:100px;height:80px;padding:10px}.actionrow .heartbutton{background:#ff4172;color:white}.actionrow small{font-size:10px;display:block;line-height:1.05;font-weight:800}
.msgrow{display:flex;margin:11px 0}.msgrow.me{justify-content:flex-end}.bubble{font-size:14px;line-height:1.4;max-width:82%;border-radius:20px 20px 20px 5px;background:#f0f0f2;padding:13px 15px}.me .bubble{background:#f94f7a;color:white;border-radius:20px 20px 5px 20px}
.bigmoney{font-size:60px;font-weight:900;color:#fa4171;margin:12px 0 4px}.progress{height:11px;background:#e9e8ec;border-radius:10px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff4f7b,#ff8ba4)}.skeleton{height:210px;background:linear-gradient(95deg,#f4f3f4,#ede7e9,#f4f3f4);border-radius:18px;margin:12px 0}.skeleton.short{height:20px;width:80%}
.bottom{position:absolute;bottom:14px;left:9px;right:9px;display:grid;grid-template-columns:repeat(4,1fr);background:white;box-shadow:0 -2px 15px #afa0a02b;border:1px solid #f9ebed;border-radius:26px;padding:9px 1px 5px;height:72px}.nav{text-align:center;font-size:24px;color:#74777e;line-height:1.1}.nav small{display:block;font-size:11px;margin-top:5px;font-weight:650}.nav.on{color:#fc4674}.teal-theme .nav.on{color:#009e84}.homebar{position:absolute;width:110px;height:4px;border-radius:4px;background:#999;bottom:4px;left:calc(50% - 55px)}
</style></head><body><div class="canvas"><div class="phone "><div class="status"><span>9:41</span><span>▮▮▮ ◈ ▰</span></div><div class="top"><span class="back">‹</span><span class="title">Liked You</span><span class="more">⋯</span></div><div class="main"><h2>People who liked you</h2><div class="notice">See incoming Likes for free. No blurred profiles.</div><div class="mini-grid"><div class="miniperson"><div class="photobox" style="height:126px;background-image:url(../assets/ron.jpg);"></div><div class="personline"><strong>Ron, 23</strong><span>0.9 km</span></div><small>Travel · Photography</small></div><div class="miniperson"><div class="photobox" style="height:126px;background-image:url(../assets/maya.jpg);"></div><div class="personline"><strong>Maya, 25</strong><span>1.2 km</span></div><small>Coffee · Art</small></div><div class="miniperson"><div class="photobox" style="height:126px;background-image:url(../assets/leo.jpg);"></div><div class="personline"><strong>Leo, 27</strong><span>2.1 km</span></div><small>Music · Sports</small></div><div class="miniperson"><div class="photobox" style="height:126px;background-image:url(../assets/nina.jpg);"></div><div class="personline"><strong>Nina, 24</strong><span>2.4 km</span></div><small>Yoga · Movies</small></div></div></div><div class="bottom"><div class="nav ">♡<small>Dating</small></div><div class="nav ">♧<small>Friendship</small></div><div class="nav on">▢<small>Connects</small></div><div class="nav ">◯<small>Profile</small></div></div><div class="homebar"></div></div></div></body></html>
